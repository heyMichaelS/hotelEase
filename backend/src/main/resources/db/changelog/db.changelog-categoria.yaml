databaseChangeLog:
  - changeSet:
      id: 1
      author: emanuelecampos
      changes:
        - createTable:
            tableName: categoria
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
              - column:
                  name: nome
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: descricao
                  type: varchar(255)
