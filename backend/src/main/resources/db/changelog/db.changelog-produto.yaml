databaseChangeLog:
  - changeSet:
      id: 1
      author: analeal
      changes:
        - createTable:
            tableName: produto
            columns:
              - column:
                  name: id
                  type: serial
                  constraints:
                    primaryKey: true
              - column:
                  name: nome
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: preco
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: categoria
                  type: varchar(50)
              - column:
                  name: disponivel
                  type: boolean
                  defaultValueBoolean: true
